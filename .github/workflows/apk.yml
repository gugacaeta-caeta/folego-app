name: Gerar apps do Fôlego

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee ../build.log
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../Folego.apk

      - name: Guardar log do erro no ramo build-logs
        if: failure()
        run: |
          git config user.name "folego-bot"
          git config user.email "folego-bot@users.noreply.github.com"
          tail -n 400 build.log > /tmp/build-${{ github.run_number }}.log || echo "sem log" > /tmp/build-${{ github.run_number }}.log
          git fetch origin build-logs || true
          git switch --orphan build-logs-tmp
          git rm -rf --quiet . || true
          cp /tmp/build-${{ github.run_number }}.log ./ultimo-erro.log
          git add ultimo-erro.log
          git commit -m "Log da execução ${{ github.run_number }}"
          git push -f origin HEAD:build-logs

      - name: Guardar APK nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: Folego-apk
          path: Folego.apk

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fôlego 1.0.${{ github.run_number }}
          body: "**Android:** baixe o arquivo **Folego.apk** no celular e toque para instalar.\n\n**iPhone:** o arquivo **Folego-iOS.ipa** é a versão de teste sem assinatura da Apple (veja o LEIA-ME para instalar)."
          files: Folego.apk
          make_latest: true

  ios:
    needs: android
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para o projeto iOS
        run: npx cap sync ios

      - name: Compilar app iOS (sem assinatura)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -version | tee ../../ios-build.log
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0.${{ github.run_number }} \
            build 2>&1 | tee -a ../../ios-build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/App.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../Folego-iOS.ipa Payload

      - name: Guardar log do erro no ramo build-logs
        if: failure()
        run: |
          git config user.name "folego-bot"
          git config user.email "folego-bot@users.noreply.github.com"
          grep -E "error:|failed|FAILED" -A3 ios-build.log | head -n 150 > /tmp/ios.log || true
          tail -n 200 ios-build.log >> /tmp/ios.log || echo "sem log" > /tmp/ios.log
          git switch --orphan ios-logs-tmp
          git rm -rf --quiet . || true
          cp /tmp/ios.log ./ultimo-erro-ios.log
          git add ultimo-erro-ios.log
          git commit -m "Log iOS da execução ${{ github.run_number }}"
          git push -f origin HEAD:build-logs-ios

      - name: Anexar versão iOS ao download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: Folego-iOS.ipa
